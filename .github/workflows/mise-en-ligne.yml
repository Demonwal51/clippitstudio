# Met le site en ligne sur clippitstudio.cc et www.clippitstudio.cc à chaque push sur main.
# Tout le travail (contrôles, envoi, vérification du quiz et du site) est fait
# par outils/deployer.js. La clé CLOUDFLARE_API_TOKEN est limitée au seul
# Worker clippitstudio : elle ne peut rien faire au quiz.
name: Mise en ligne

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Une seule mise en ligne à la fois, dans l'ordre des push.
concurrency:
  group: mise-en-ligne
  cancel-in-progress: false

jobs:
  deployer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run deployer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
