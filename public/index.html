<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clippit Studio — bientôt en ligne</title>
<meta name="description" content="Le site de Clippit Studio arrive bientôt.">
<meta name="theme-color" content="#0b1022">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Clippit Studio">
<meta property="og:description" content="Le site arrive bientôt.">
<meta property="og:url" content="https://clippitstudio.cc/">
<meta property="og:image" content="https://clippitstudio.cc/img/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root { --fond: #0b1022; --texte: #eef1f8; --doux: #9aa6c4; --cyan: #22c7e8; --orange: #f47a20; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100%;
    display: grid;
    place-items: center;
    padding: 24px;
    background:
      radial-gradient(60vmax 60vmax at 15% 10%, rgba(34, 199, 232, .16), transparent 60%),
      radial-gradient(50vmax 50vmax at 90% 95%, rgba(244, 122, 32, .14), transparent 60%),
      var(--fond);
    color: var(--texte);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  main { display: flex; flex-direction: column; align-items: center; gap: 20px; max-width: 560px; }
  .logo {
    width: min(78vw, 440px);
    height: auto;
    filter: drop-shadow(0 18px 40px rgba(0, 0, 0, .55));
    animation: route 3.2s ease-in-out infinite;
  }
  @keyframes route {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    50% { transform: translateY(-10px) rotate(1deg); }
  }
  h1 { font-size: clamp(1.6rem, 5vw, 2.4rem); font-weight: 800; letter-spacing: .02em; }
  h1 span { color: var(--orange); }
  p { color: var(--doux); font-size: 1.05rem; line-height: 1.5; }
  .barre { width: min(60vw, 260px); height: 6px; border-radius: 99px; background: rgba(255, 255, 255, .08); overflow: hidden; }
  .barre::after {
    content: "";
    display: block;
    width: 40%;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--cyan), var(--orange));
    animation: charge 2.4s ease-in-out infinite;
  }
  @keyframes charge { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  footer { font-size: .85rem; color: var(--doux); opacity: .7; }
  @media (prefers-reduced-motion: reduce) { .logo, .barre::after { animation: none; } }
</style>
</head>
<body>
<main>
  <img class="logo" src="img/logo-480.webp"
       srcset="img/logo-480.webp 480w, img/logo-960.webp 960w"
       sizes="(max-width: 564px) 78vw, 440px"
       width="440" height="440"
       alt="Logo Clippits : un trombone aux grands yeux au volant d'une petite voiture">
  <h1>Bientôt en ligne<span>.</span></h1>
  <p>Le site de Clippit Studio est en route. Encore un peu de patience !</p>
  <div class="barre" aria-hidden="true"></div>
  <footer>clippitstudio.cc</footer>
</main>
</body>
</html>
